<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>v2 unit tests</title>
  <style>
    body { font-family: monospace; padding: 1rem; }
    .pass { color: green; }
    .fail { color: red; font-weight: bold; }
  </style>
</head>
<body>
<h2>v2 unit tests</h2>
<div id="results"></div>
<script type="module">
const results = document.getElementById('results');
let passed = 0, failed = 0;

function assert(condition, label) {
  const el = document.createElement('div');
  el.className = condition ? 'pass' : 'fail';
  el.textContent = (condition ? '✓ ' : '✗ ') + label;
  results.appendChild(el);
  condition ? passed++ : failed++;
}

// ── isYin tests ───────────────────────────────────────────────────────────
function isYin(px, py) {
  if (px * px + py * py > 1.0) return false;
  const seedR2 = 0.0324;
  if (px * px + (py - 0.5) * (py - 0.5) < seedR2) return true;
  if (px * px + (py + 0.5) * (py + 0.5) < seedR2) return false;
  if (py >= 0) {
    if (px * px + (py - 0.5) * (py - 0.5) < 0.25) return false;
    return px > 0;
  } else {
    if (px * px + (py + 0.5) * (py + 0.5) < 0.25) return true;
    return px > 0;
  }
}

assert(isYin(2, 0) === false,        'outside unit circle → false');
assert(isYin(0.5, 0.5) === true,     'top-right outer wing → yin');
assert(isYin(-0.5, 0.5) === false,   'top-left outer wing → yang');
assert(isYin(0, 0.5) === false,      'top center (yang fish head) → yang');
assert(isYin(0, -0.5) === true,      'bottom center (yin fish head) → yin');
assert(isYin(0.5, -0.5) === true,    'bottom-right outer wing → yin');
assert(isYin(-0.5, -0.5) === false,  'bottom-left outer wing → yang');
assert(isYin(0.01, 0.5) === true,    'just right of top seed → yin (dark seed override)');

// ── Rotation math tests ───────────────────────────────────────────────────
function rotateZ(x, y, theta) {
  return [
    x * Math.cos(theta) - y * Math.sin(theta),
    x * Math.sin(theta) + y * Math.cos(theta),
  ];
}
{
  const [rx, ry] = rotateZ(1, 0, Math.PI / 2);
  assert(Math.abs(rx) < 1e-10,     'rotateZ(1,0,π/2).x ≈ 0');
  assert(Math.abs(ry - 1) < 1e-10, 'rotateZ(1,0,π/2).y ≈ 1');
}
{
  const [rx, ry] = rotateZ(0, 1, Math.PI / 2);
  assert(Math.abs(rx + 1) < 1e-10, 'rotateZ(0,1,π/2).x ≈ -1');
  assert(Math.abs(ry) < 1e-10,     'rotateZ(0,1,π/2).y ≈ 0');
}

// ── Surface project invariant ─────────────────────────────────────────────
{
  const pos = new Float32Array([2, 3, 6]); // |pos| = 7
  const len = Math.sqrt(pos[0]*pos[0] + pos[1]*pos[1] + pos[2]*pos[2]);
  pos[0] /= len; pos[1] /= len; pos[2] /= len;
  const lenAfter = Math.sqrt(pos[0]*pos[0] + pos[1]*pos[1] + pos[2]*pos[2]);
  assert(Math.abs(lenAfter - 1) < 1e-6, 'surface project: |pos| = 1 after normalize');
}

// ── NaN guard test ────────────────────────────────────────────────────────
{
  const pos = new Float32Array([0, 0, 0]);
  const len = Math.sqrt(pos[0]*pos[0] + pos[1]*pos[1] + pos[2]*pos[2]);
  assert(len < 1e-6, 'NaN guard: zero-length pos detected (len < 1e-6)');
}

// ── Rotation direction test ───────────────────────────────────────────────
// theta must decrease each frame (heads-lead, matching v1's group.rotation.z -= rotSpeed)
{
  const SPIN = 0.004;
  let theta = 0;
  theta -= SPIN;
  assert(theta < 0, 'rotation direction: theta decreases per frame (heads-lead)');
}

// ── Summary ───────────────────────────────────────────────────────────────
const summary = document.createElement('p');
summary.textContent = `${passed} passed, ${failed} failed`;
results.appendChild(summary);
</script>
</body>
</html>
