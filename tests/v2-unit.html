<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>v2 unit tests</title>
  <style>
    body { font-family: monospace; padding: 1rem; }
    .pass { color: green; }
    .fail { color: red; font-weight: bold; }
  </style>
</head>
<body>
<h2>v2 unit tests</h2>
<div id="results"></div>
<script type="module">
import { isYin, isYinSphere, makeFibGrid, assignSparseHomes, clampToRange, DEFAULTS, RANGES } from '../src/v2-core.js';

const results = document.getElementById('results');
let passed = 0, failed = 0;

function assert(condition, label) {
  const el = document.createElement('div');
  el.className = condition ? 'pass' : 'fail';
  el.textContent = (condition ? '✓ ' : '✗ ') + label;
  results.appendChild(el);
  condition ? passed++ : failed++;
}

const deg = rad => rad * 180 / Math.PI;
const angle = (a, i, b, j) => deg(Math.acos(Math.max(-1, Math.min(1,
  a[i] * b[j] + a[i + 1] * b[j + 1] + a[i + 2] * b[j + 2]))));
const median = xs => { const s = [...xs].sort((p, q) => p - q); return s[Math.floor(s.length / 2)]; };

// ── Settings: URL values are clamped and snapped ─────────────────────────
{
  const r = { min: 0.5, max: 2.5, step: 0.1 };
  assert(clampToRange(null, r, 1) === 1,        'clamp: missing value → default');
  assert(clampToRange('', r, 1) === 1,          'clamp: empty value → default');
  assert(clampToRange('  ', r, 1) === 1,        'clamp: blank value → default');
  assert(clampToRange('abc', r, 1) === 1,       'clamp: non-number → default');
  assert(clampToRange('Infinity', r, 1) === 1,  'clamp: Infinity → default');
  assert(clampToRange('NaN', r, 1) === 1,       'clamp: NaN → default');
  assert(clampToRange('9', r, 1) === 2.5,       'clamp: above max → max');
  assert(clampToRange('-3', r, 1) === 0.5,      'clamp: below min → min');
  assert(clampToRange('1.23', r, 1) === 1.2,    'clamp: snapped to the slider step (1.23 → 1.2)');
  assert(clampToRange('0.3', { min: 0, max: 1, step: 0.1 }, 0) === 0.3, 'clamp: no float noise (0.3 stays 0.3)');
  assert(clampToRange('77777', RANGES.dense, 1) === 80000, 'clamp: dense snaps to 5,000s (77,777 → 80,000)');
  assert(clampToRange('0', RANGES.sparse, 1) === 200, 'clamp: sparse 0 → 200 (no zero-size grid)');
  assert(clampToRange('1.5', RANGES.damping, 1) === 0.99, 'clamp: damping ≥ 1 → 0.99 (no runaway motion)');
}
{
  const missing = Object.keys(DEFAULTS).filter(k => !RANGES[k]);
  assert(missing.length === 0, `every setting has a range (${missing.join(', ') || 'none missing'})`);
  const bad = Object.entries(DEFAULTS).filter(([k, v]) => clampToRange(String(v), RANGES[k], NaN) !== v).map(([k]) => k);
  assert(bad.length === 0, `every default is a value its slider can reach (${bad.join(', ') || 'all ok'})`);
}

// ── isYin tests ───────────────────────────────────────────────────────────
assert(isYin(2, 0) === false,        'outside unit circle → false');
assert(isYin(0.5, 0.5) === true,     'top-right outer wing → yin');
assert(isYin(-0.5, 0.5) === false,   'top-left outer wing → yang');
assert(isYin(0, 0.3) === false,      'top fish head, beside the seed → yang');
assert(isYin(0, -0.3) === true,      'bottom fish head, beside the seed → yin');
assert(isYin(0, 0.5) === true,       'top seed centre → yin (dark seed in the yang head)');
assert(isYin(0, -0.5) === false,     'bottom seed centre → yang (light seed in the yin head)');
assert(isYin(0.5, -0.5) === true,    'bottom-right outer wing → yin');
assert(isYin(-0.5, -0.5) === false,  'bottom-left outer wing → yang');
assert(isYin(0.01, 0.5) === true,    'just right of top seed → yin (dark seed override)');

// ── isYinSphere: back hemisphere is the front flipped top-to-bottom ───────
assert(isYinSphere(0.5, 0.5, 0.5) === true,     'front: top-right outer wing → yin');
assert(isYinSphere(-0.5, 0.5, 0.5) === false,   'front: top-left outer wing → yang');
assert(isYinSphere(0.3, 0.5, -0.8) === true,    'back: top flips to bottom → yin fish head');
assert(isYinSphere(-0.3, -0.5, -0.8) === false, 'back: bottom flips to top → yang fish head');

// Seamless rim: on z = 0 the front and back classifications must agree.
// (The fish heads touch the rim tangentially at the top and bottom tips, so
// sample just inside the rim — any mismatch there shrinks to a single point.)
{
  let mismatches = 0;
  for (let k = 0; k < 360; k++) {
    const a = (k + 0.5) * Math.PI / 180;
    const x = Math.cos(a) * 0.99999, y = Math.sin(a) * 0.99999;
    if (isYinSphere(x, y, 1e-6) !== isYinSphere(x, y, -1e-6)) mismatches++;
  }
  assert(mismatches === 0, `rim seam: front/back agree all around z = 0 (${mismatches} mismatches)`);
}

// ── Fibonacci grid ─────────────────────────────────────────────────────────
{
  const g = makeFibGrid(2000);
  let worst = 0;
  for (let i = 0; i < g.length; i += 3) worst = Math.max(worst, Math.abs(Math.hypot(g[i], g[i + 1], g[i + 2]) - 1));
  assert(worst < 1e-6, `grid points lie on the unit sphere (worst error ${worst.toExponential(1)})`);
  assert(g[1] === 1 && g[g.length - 2] === -1, 'grid runs from the north pole (y = 1) to the south pole (y = -1)');
}

// ── Sparse home assignment ─────────────────────────────────────────────────
const dense  = makeFibGrid(20000);
const sparse = makeFibGrid(1800);
const N = dense.length / 3, M = sparse.length / 3;

function hops(assign) {
  const out = new Float64Array(N);
  for (let i = 0; i < N; i++) out[i] = angle(dense, i * 3, assign, i * 3);
  return out;
}

{
  // Reach 0 = nearest sparse point (checked against brute force on a sample)
  const near = assignSparseHomes(dense, sparse, 0);
  let wrong = 0;
  for (let i = 0; i < N; i += 37) {
    let best = -1, bestDot = -2;
    for (let j = 0; j < M; j++) {
      const d = dense[i * 3] * sparse[j * 3] + dense[i * 3 + 1] * sparse[j * 3 + 1] + dense[i * 3 + 2] * sparse[j * 3 + 2];
      if (d > bestDot) { bestDot = d; best = j; }
    }
    if (near[i * 3] !== sparse[best * 3] || near[i * 3 + 1] !== sparse[best * 3 + 1] || near[i * 3 + 2] !== sparse[best * 3 + 2]) wrong++;
  }
  assert(wrong === 0, `reach 0: every particle gets its nearest sparse point (${wrong} wrong in sample)`);

  // Regression: index-based assignment sent particles up to 180° away
  const maxHop = Math.max(...hops(near));
  assert(maxHop < 5, `reach 0: no long hops between homes (max ${maxHop.toFixed(1)}°)`);
}

{
  // Every assigned home is exactly a sparse grid point
  const assign = assignSparseHomes(dense, sparse, 5);
  const keys = new Set();
  for (let j = 0; j < M; j++) keys.add(`${sparse[j * 3]},${sparse[j * 3 + 1]},${sparse[j * 3 + 2]}`);
  let off = 0;
  for (let i = 0; i < N; i++) if (!keys.has(`${assign[i * 3]},${assign[i * 3 + 1]},${assign[i * 3 + 2]}`)) off++;
  assert(off === 0, `reach 5: every sparse home is a sparse grid point (${off} off-grid)`);

  // Seeded: same layout every time
  const again = assignSparseHomes(dense, sparse, 5);
  assert(assign.every((v, k) => v === again[k]), 'reach 5: assignment is the same on every run (seeded)');
}

for (const reach of [5, 10]) {
  const m = median(hops(assignSparseHomes(dense, sparse, reach)));
  assert(Math.abs(m - reach) < reach * 0.15, `reach ${reach}: median hop ≈ ${reach}° (got ${m.toFixed(1)}°)`);
}

{
  // At rest, sparse homes deep inside the yin are empty: a sparse point is
  // only occupied by particles whose dense home is yang, and those are all
  // within the cap radius (reach·√2) plus a grid spacing of it.
  const reach = 5;
  const assign = assignSparseHomes(dense, sparse, reach);
  const occupied = new Set();
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    if (!isYinSphere(dense[i3], dense[i3 + 1], dense[i3 + 2])) occupied.add(`${assign[i3]},${assign[i3 + 1]},${assign[i3 + 2]}`);
  }
  const cosLimit = Math.cos((reach * Math.SQRT2 + 2 * deg(Math.sqrt(4 * Math.PI / M))) * Math.PI / 180);
  let deepOccupied = 0, deep = 0;
  for (let j = 0; j < M; j++) {
    const j3 = j * 3;
    let nearYang = false;
    for (let i = 0; i < N && !nearYang; i++) {
      const i3 = i * 3;
      const c = sparse[j3] * dense[i3] + sparse[j3 + 1] * dense[i3 + 1] + sparse[j3 + 2] * dense[i3 + 2];
      if (c > cosLimit && !isYinSphere(dense[i3], dense[i3 + 1], dense[i3 + 2])) nearYang = true;
    }
    if (nearYang) continue;
    deep++;
    if (occupied.has(`${sparse[j3]},${sparse[j3 + 1]},${sparse[j3 + 2]}`)) deepOccupied++;
  }
  assert(deep > 100 && deepOccupied === 0,
    `reach 5: sparse homes deep inside the yin are empty at rest (${deepOccupied} of ${deep} occupied)`);
}

// ── Surface project invariant ─────────────────────────────────────────────
{
  const pos = new Float32Array([2, 3, 6]); // |pos| = 7
  const len = Math.sqrt(pos[0]*pos[0] + pos[1]*pos[1] + pos[2]*pos[2]);
  pos[0] /= len; pos[1] /= len; pos[2] /= len;
  const lenAfter = Math.sqrt(pos[0]*pos[0] + pos[1]*pos[1] + pos[2]*pos[2]);
  assert(Math.abs(lenAfter - 1) < 1e-6, 'surface project: |pos| = 1 after normalize');
}

// ── Summary ───────────────────────────────────────────────────────────────
const summary = document.createElement('p');
summary.id = 'summary';
summary.textContent = `${passed} passed, ${failed} failed`;
results.appendChild(summary);
</script>
</body>
</html>
